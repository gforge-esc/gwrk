name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Both values must stay in sync with the required status-check contexts
        # in scripts/setup-github-public.sh (`ci (20)` and `ci (22)`). Dropping a
        # value here without updating the rulesets leaves a required check that
        # never reports and blocks every PR. Node 20 matches CONTRIBUTING's
        # "Node 20 and 22" promise; engines.node is >= 18.
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check hosted task gates
        run: node tests/hosted-pilot/gate-completeness.test.mjs

      - name: Check ADR citations and index
        run: node dist/cli.js define adr --check

      - name: Configure Git for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: pnpm test:ci
        env:
          CI: "true"
          VITEST_MAX_FORKS: "2"
          VITEST_MIN_FORKS: "1"

      - name: Hosted sign-in container proof
        if: matrix.node-version == 22
        run: node tests/hosted-auth-proof/gateway-proof.mjs

      - name: Lint
        run: pnpm lint


      - name: Setup Python for portal verification
        if: matrix.node-version == 22
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portal test dependencies
        if: matrix.node-version == 22
        run: |
          python -m pip install -r scripts/portal-requirements.txt
          pnpm exec playwright install --with-deps chromium

      - name: Check generator link contracts
        if: matrix.node-version == 22
        run: python tests/portal/test_link_integrity.py

      - name: Rebuild packaged portal
        if: matrix.node-version == 22
        run: |
          sphinx-build -b html docs/site docs/site/_build/html
          python scripts/build-portal.py
          pnpm exec biome format --write src/server/routes/portal-html.ts
          git diff --exit-code -- src/server/routes/portal-html.ts

      - name: Test public guide navigation in Chromium
        if: matrix.node-version == 22
        run: pnpm test:portal

      - name: Preserve browser failure traces
        if: matrix.node-version == 22 && failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-traces
          path: test-results/
          retention-days: 14

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag_name }}

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Build Linux release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/gwrk-release"
          node scripts/release/build-linux-release.mjs "$RUNNER_TEMP/gwrk-release" "$RELEASE_TAG"
          cp deploy/linux-runner/install-release.sh "$RUNNER_TEMP/gwrk-release/"

      - name: Upload Linux release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          cd "$RUNNER_TEMP/gwrk-release"
          tag="$RELEASE_TAG"
          file="gwrk-${tag}.tgz"
          # release-please creates the GitHub Release moments before this step;
          # the REST lookup `gh` uses can lag, which surfaced as a consistent
          # "release not found" on every release run. Wait for it to be visible,
          # then upload idempotently so re-runs don't fail on an existing asset.
          for attempt in $(seq 1 6); do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$file" "${file}.sha256" release-manifest.json install-release.sh --clobber
              echo "Uploaded ${file} to release ${tag}"
              exit 0
            fi
            echo "Release ${tag} not visible yet (attempt ${attempt}/6); waiting 10s..."
            sleep 10
          done
          echo "::error::Release ${tag} never became available for asset upload"
          exit 1

services:
  traefik:
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=public
      - --certificatesresolvers.public.acme.email=${GWRK_PROOF_ACME_EMAIL:?Set GWRK_PROOF_ACME_EMAIL}
      - --certificatesresolvers.public.acme.storage=/acme/acme.json
      - --certificatesresolvers.public.acme.tlschallenge=true
      - --providers.file.filename=/etc/traefik/dynamic.yaml
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - acme:/acme
    networks:
      auth:
        ipv4_address: 172.30.41.2
      status: {}

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GWRK_PROOF_GOOGLE_CLIENT_ID:?Set GWRK_PROOF_GOOGLE_CLIENT_ID}
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./local:/run/gwrk-proof:ro
    networks: [auth]

  status:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    volumes:
      - ./status/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [status]

networks:
  auth:
    ipam:
      config:
        - subnet: 172.30.41.0/29
  status:
    internal: true

volumes:
  acme:

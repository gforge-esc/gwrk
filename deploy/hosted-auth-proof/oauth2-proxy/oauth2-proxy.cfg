http_address = "0.0.0.0:4180"
provider = "oidc"
provider_display_name = "Google"
oidc_issuer_url = "https://accounts.google.com"
redirect_url = "https://gwrk.gforge.ai/oauth2/callback"
scope = "openid email"
whitelist_domains = ["gwrk.gforge.ai"]
code_challenge_method = "S256"
client_secret_file = "/run/gwrk-proof/google-client-secret"
authenticated_emails_file = "/run/gwrk-proof/allowed-emails"
insecure_oidc_allow_unverified_email = false
insecure_oidc_skip_issuer_verification = false

reverse_proxy = true
trusted_proxy_ips = ["172.30.41.2/32"]
upstreams = ["static://404"]
set_xauthrequest = false
pass_access_token = false
pass_authorization_header = false
pass_user_headers = false
cookie_name = "__Host-gwrk_proof"
cookie_secret_file = "/run/gwrk-proof/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "1h"
cookie_refresh = "0s"
cookie_csrf_per_request = true
cookie_csrf_expire = "5m"
auth_logging = false
request_logging = false

server {
    listen 8080;
    server_tokens off;
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;

    location ~ ^/(status)?$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 200 '{"service":"gwrk-auth-proof","status":"ok"}\n';
    }

    location / {
        return 404;
    }
}

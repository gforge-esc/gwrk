http_address = "127.0.0.1:4180"
provider = "oidc"
provider_display_name = "Google"
oidc_issuer_url = "https://accounts.google.com"
redirect_url = "https://gwrk.gforge.ai/oauth2/callback"
scope = "openid email"
whitelist_domains = ["gwrk.gforge.ai"]
code_challenge_method = "S256"

client_secret_file = "/etc/gwrk/gateway-secrets/oauth-client-secret"
cookie_secret_file = "/etc/gwrk/gateway-secrets/oauth-cookie-secret"
authenticated_emails_file = "/etc/gwrk/secrets/google-account-allowlist"

insecure_oidc_skip_nonce = false
insecure_oidc_allow_unverified_email = false
insecure_oidc_skip_issuer_verification = false

reverse_proxy = true
real_client_ip_header = "X-Forwarded-For"
trusted_proxy_ips = ["127.0.0.1/32"]
trusted_ips = []
upstreams = ["static://404"]

set_authorization_header = true
pass_authorization_header = false
pass_access_token = false
pass_user_headers = false
set_xauthrequest = false

cookie_name = "__Host-gwrk_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "1h"
cookie_refresh = "0s"
cookie_csrf_per_request = true
cookie_csrf_expire = "5m"

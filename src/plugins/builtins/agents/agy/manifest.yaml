type: agent
name: agy
version: 1.1.0
description: "Antigravity CLI backend"
dispatchMode: local-cli
contextFileName: AGENTS.md

invocation:
  command: agy
  args: ["--output-format", "stream-json"]
  headlessFlag: "-p"
  yoloFlag: "--dangerously-skip-permissions"

capabilities:
  - stdin
  - context-file
  - stream-json
  - json-schema

models:
  default: gemini-4-argon-high
  fast: gemini-3.8-flash-high
  review: claude-opus-5-5-high

exitCodeMap:
  "0":
    exitCode: 0
  "1":
    exitCode: 1
  "2":
    exitCode: 2
  "127":
    exitCode: 127
    errorType: command_not_found

managedConfig:
  - path: ".gwrkrc.json"
    keys: ["agents.agy"]

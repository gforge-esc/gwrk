type: workflow
name: gwrk-ontology-construct
version: 0.2.0
description: "Constructs a domain ontology using the Five Primitives methodology"
prompt: ../gwrk-research-ontology/PROMPT.md
outputSchema:
  type: object
  properties:
    summary:
      type: string
    intents:
      type: array
      items:
        type: object
        properties:
          action:
            type: string
            enum: [WRITE_FILE, CREATE_DIR, RUN_COMMAND]
          filePath:
            type: string
          content:
            type: string
          dirPath:
            type: string
          command:
            type: string
        required: [action]
  required: [summary, intents]
